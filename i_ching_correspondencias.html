    .btn {

      border: 1px solid var(--border-color); background: var(--bg-card); color: var(--text-main);

    .btn-navy { background: var(--navy-accent); color: white; border: none; }

    .container { max-width: 1380px; margin: 0 auto; padding: 24px 20px 80px 20px; }

    /* Header Banner */
    .header-box {

      box-shadow: var(--shadow-sm);

    .header-badge {

      font-size: 0.76rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1.5px;

      background: var(--bg-soft); border: 1px solid var(--border-color); border-radius: 10px; padding: 16px;

    .theory-card strong { color: var(--text-main); display: block; margin-bottom: 4px; font-size: 0.95rem; }

    .oracle-input:focus { border-color: var(--navy-accent); box-shadow: 0 0 0 3px rgba(30, 58, 138, 0.1); }

    .quick-questions { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }

      font-size: 0.8rem; background: var(--bg-soft); border: 1px solid var(--border-color);
      padding: 4px 10px; border-radius: 16px; cursor: pointer; color: var(--text-muted);
      transition: all 0.15s ease;
    }
    .quick-pill:hover { background: #FEF3C7; border-color: #FCD34D; color: var(--gold-accent); }

    .oracle-result-box {
      display: none; background: #F8FAFC; border: 1px solid #CBD5E1; border-radius: 12px;
      padding: 20px 24px; margin-top: 18px; animation: fadeIn 0.3s ease;

    .toolbar {
      background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 12px;

    .search-input {

    .table-container {
      background: #FFFFFF; border: 1px solid var(--border-color); border-radius: 14px;

    table.iching-table th {

      border-bottom: 2px solid var(--border-color); white-space: nowrap; font-size: 0.84rem; text-transform: uppercase; letter-spacing: 0.5px;

    table.iching-table td {

    .hex-num-badge {

cias pasajeras; alinea tu mente con la Consciencia Crística presente y con el fluir sin obstáculos del Tao. Donde hay alineación interior, el camino se manifiesta sin esfuerzo.", "res_full": "📖 Ver la respuesta completa con las enseñanzas del Gurú ↗", "res_source": "📌 Fuente y Atribución Canónica:", "res_wilhelm": "Basado en la traducción canónica de <strong>Richard Wilhelm</strong> (con cotejo al texto original en alemán).", "footer1": "<strong>Tabla Avanzada de Correspondencias del I Ching</strong> &bull; Integrado en el ecosistema <em>EL GURÚ INTERIOR</em>", "footer2": "Fuente y Derechos Canónicos:", "footer3": "Basado en la traducción clásica de <strong>Richard Wilhelm</strong> con referencias comparativas al texto original en alemán."}, "fr": {"page_title": "Table avancée des correspondances du Yi King · El I Chingón | LE GOUROU INTÉRIEUR", "brand": "🕉️ LE GOUROU INTÉRIEUR", "nav_sub": "/ Yi King avancé", "btn_library": "📖 Bibliothèque centrale", "btn_oracle_nav": "🔮 Consulter l'Oracle", "btn_official": "🌐 El I Chingón officiel ↗", "badge": "☯️ Matrice de Sagesse Traditionnelle & Dynamique Holographique", "title": "Table avancée des correspondances <span>du Yi King</span>", "subtitle": "La structure complète des 64 hexagrammes, croisant l'ordre classique du Roi Wen, l'Hexagramme Nucléaire interne de chacun (graine dynamique cachée) et sa correspondance archétypale dans le Ciel Antérieur (Fu Xi / Xiān Tiān Bāguà).", "src_label": "Source canonique originale :", "src_wilhelm": "Traduction traditionnelle de <strong>Richard Wilhelm</strong> (collationnée avec le texte original allemand).", "theory_title": "🧭 Fondement structurel : Ciel Postérieur (Hou Tian) et Ciel Antérieur (Xian Tian)", "theory_p1": "Contrairement à un simple index de position, la colonne du <strong>Ciel Antérieur</strong> de cette matrice donne le numéro, dans l'ordre du Roi Wen, de l'hexagramme obtenu en <em>transposant symétriquement chaque trigramme</em> de son quadrant dans le schéma du Ciel Postérieur (Hou Tian) vers la direction équivalente dans le Ciel Antérieur (Xian Tian).", "theory_nuc_title": "🧬 L'Hexagramme Nucléaire (H. nucléaire) :", "theory_nuc_desc": "Formé des traits 2, 3 et 4 (trigramme inférieur interne) et 3, 4 et 5 (trigramme supérieur interne). Il révèle la graine cachée, la cause profonde et la direction vers laquelle évolue la situation.", "theory_fuxi_title": "🌌 Correspondance avec le Ciel Antérieur (Fu Xi) :", "theory_fuxi_desc": "Par exemple, l'Hexagramme 1 (Qián pur, au Nord-Ouest du Hou Tian) se projette harmonieusement sur l'Hexagramme 52 (Gèn pur, au Nord-Ouest du Xian Tian), unissant l'action pure à l'immobilité pure.", "oracle_badge": "🔮 Oracle de Sagesse & Consultation", "oracle_title": "Consulter le Yi King & Le Gourou Intérieur", "oracle_desc": "Posez une question sur votre moment de vie, votre travail ou une décision importante. Le système révélera votre hexagramme synchronique, sa graine nucléaire cachée et sa correspondance archétypale, en réunissant les enseignements d'El I Chingón et du Gourou Intérieur.", "quick_label": "Questions rapides :", "quick": [["🧭 La juste attitude pour mon moment", "Quelle est la juste attitude et le pas sage pour mon moment présent ?"], ["🕊️ Résoudre un conflit / blocage", "Comment résoudre ce conflit ou ce blocage dans la paix intérieure ?"], ["🌱 But et graine cachée", "Vers où se dirige mon but et quelle est la graine cachée ?"], ["💼 Décision professionnelle / financière", "Comment agir face à cette décision financière et professionnelle ?"]], "placeholder": "Écrivez ici votre question au Yi King...", "btn_consultar": "Consulter l'hexagramme ✨", "btn_tirar": "🪙 Lancer les pièces (tirage)", "search_placeholder": "🔍 Rechercher par numéro (1-64), nom, pinyin ou idéogramme chinois...", "trig_all": "Tous les trigrammes supérieurs", "counter": "{n} hexagrammes affichés sur 64", "th": ["N° Roi Wen", "Glyphe", "Nom (Français / Pinyin / Chinois)", "Composition", "Description essentielle", "H. nucléaire", "Ciel Antérieur (Fu Xi)", "Texte complet"], "read_wilhelm": "Voir chez Wilhelm ↗", "sup": "Sup", "inf": "Inf", "modal_badge": "Hexagramme Roi Wen #{n}", "modal_desc_title": "📜 Description essentielle (essence canonique) :", "modal_nuc_title": "🧬 Hexagramme nucléaire (graine intérieure)", "modal_nuc_text": "Il représente les forces sous-jacentes (traits 2 à 5) qui préparent l'issue de la situation.", "modal_fuxi_title": "🌌 Ciel Antérieur (Fu Xi / Xian Tian)", "modal_fuxi_text": "Correspondance archétypale, directionnelle et symétrique, selon l'ordre primordial de Fu Xi.", "modal_read_full": "📖 Lire la traduction complète de Richard Wilhelm sur El I Chingón ↗", "modal_consult": "🔮 Consulter cet hexagramme dans l'Oracle", "hex_question": "Quel est l'enseignement profond de l'Hexagramme #{n} pour ma vie aujourd'hui ?", "toss_label": "Tirage synchronique des pièces (Hexagramme #{n})", "alert": "Veuillez écrire une question pour consulter l'Oracle.", "res_badge": "✨ Réponse synchronique de l'Oracle", "res_hex": "Hexagramme", "res_query": "Question :", "res_draw": "Tirage de l'Oracle", "res_canon": "📖 Texte canonique sur El I Chingón ↗", "res_present": "🎯 Diagnostic du moment présent :", "res_nuc": "🧬 Graine nucléaire cachée (vecteur intérieur) :", "res_fuxi": "🌌 Archétype du Ciel Antérieur (Fu Xi) :", "res_comp": "☯️ Composition :", "res_upper": "En haut", "res_lower": "En bas", "res_synth_title": "🕉️ Synthèse du Gourou Intérieur (Swami Sri Yukteswar, Paramahansa Yogananda & Lettres du Christ) :", "res_synth": "La mutabilité cosmique des forces extérieures n'est que la danse de Maya et des Yugas. L'Hexagramme #{h} ({name}) révèle que votre état présent demande de cultiver la graine intérieure de #{nn} ({nuc}). Ne réagissez pas impulsivement aux apparences passagères ; alignez votre esprit sur la Conscience Christique présente et sur le libre courant du Tao. Là où il y a alignement intérieur, le chemin se manifeste sans effort.", "res_full": "📖 Voir la réponse complète avec les enseignements du Gourou ↗", "res_source": "📌 Source et attribution canonique :", "res_wilhelm": "Fondé sur la traduction canonique de <strong>Richard Wilhelm</strong> (collationnée avec le texte original allemand).", "footer1": "<strong>Table avancée des correspondances du Yi King</strong> &bull; Intégrée à l'écosystème <em>LE GOUROU INTÉRIEUR</em>", "footer2": "Source et droits canoniques :", "footer3": "Fondé sur la traduction classique de <strong>Richard Wilhelm</strong>, avec des références comparatives au texte original allemand."}, "de": {"page_title": "Erweiterte Entsprechungstabelle des I Ging · El I Chingón | DER INNERE GURU", "brand": "🕉️ DER INNERE GURU", "nav_sub": "/ I Ging für Fortgeschrittene", "btn_library": "📖 Zentrale Bibliothek", "btn_oracle_nav": "🔮 Das Orakel befragen", "btn_official": "🌐 Offizielles El I Chingón ↗", "badge": "☯️ Traditionelle Weisheitsmatrix & Holographische Dynamik", "title": "Erweiterte Entsprechungstabelle <span>des I Ging</span>", "subtitle": "Die vollständige Struktur der 64 Hexagramme: die klassische Reihenfolge König Wens, das innere Kernhexagramm jedes Zeichens (verborgener dynamischer Same) und seine archetypische Entsprechung im Früheren Himmel (Fu Xi / Xiān Tiān Bāguà).", "src_label": "Ursprüngliche kanonische Quelle:", "src_wilhelm": "Traditionelle Übersetzung von <strong>Richard Wilhelm</strong> (abgeglichen mit dem deutschen Originaltext).", "theory_title": "🧭 Strukturelle Grundlage: Späterer Himmel (Hou Tian) und Früherer Himmel (Xian Tian)", "theory_p1": "Anders als ein gewöhnlicher Positionsindex gibt die Spalte <strong>Früherer Himmel</strong> in dieser Matrix die Nummer (in der Reihenfolge König Wens) des Hexagramms an, das entsteht, wenn man <em>jedes Trigramm symmetrisch</em> aus seinem Quadranten im Schema des Späteren Himmels (Hou Tian) in die entsprechende Richtung des Früheren Himmels (Xian Tian) überträgt.", "theory_nuc_title": "🧬 Das Kernhexagramm (Kern-H.):", "theory_nuc_desc": "Gebildet aus den Linien 2, 3 und 4 (inneres unteres Trigramm) und 3, 4 und 5 (inneres oberes Trigramm). Es zeigt den verborgenen Samen, die tiefere Ursache und die Richtung, in die sich die Lage entwickelt.", "theory_fuxi_title": "🌌 Entsprechung im Früheren Himmel (Fu Xi):", "theory_fuxi_desc": "So projiziert sich etwa Hexagramm 1 (reines Qián, im Nordwesten des Hou Tian) harmonisch auf Hexagramm 52 (reines Gèn, im Nordwesten des Xian Tian) und verbindet reines Handeln mit reiner Stille.", "oracle_badge": "🔮 Orakel der Weisheit & Befragung", "oracle_title": "Das I Ging & den Inneren Guru befragen", "oracle_desc": "Stelle eine Frage zu deiner Lebenslage, deiner Arbeit oder einer wichtigen Entscheidung. Das System zeigt dein synchrones Hexagramm, seinen verborgenen Kernsamen und seine archetypische Entsprechung und verbindet die Lehren von El I Chingón mit dem Inneren Guru.", "quick_label": "Schnelle Fragen:", "quick": [["🧭 Die rechte Haltung für meinen Moment", "Was ist die rechte Haltung und der weise Schritt für meinen jetzigen Moment?"], ["🕊️ Konflikt / Blockade lösen", "Wie kann ich diesen Konflikt oder diese Blockade mit innerem Frieden lösen?"], ["🌱 Bestimmung und verborgener Same", "Wohin führt meine Bestimmung und was ist der verborgene Same?"], ["💼 Berufliche / finanzielle Entscheidung", "Wie soll ich bei dieser finanziellen und beruflichen Entscheidung handeln?"]], "placeholder": "Schreibe hier deine Frage an das I Ging...", "btn_consultar": "Hexagramm befragen ✨", "btn_tirar": "🪙 Münzen werfen (Ziehung)", "search_placeholder": "🔍 Suche nach Nummer (1-64), Name, Pinyin oder chinesischem Schriftzeichen...", "trig_all": "Alle oberen Trigramme", "counter": "{n} von 64 Hexagrammen angezeigt", "th": ["König-Wen-Nr.", "Zeichen", "Name (Deutsch / Pinyin / Chinesisch)", "Aufbau", "Wesentliche Beschreibung", "Kern-H.", "Früherer Himmel (Fu Xi)", "Volltext"], "read_wilhelm": "Bei Wilhelm lesen ↗", "sup": "Oben", "inf": "Unten", "modal_badge": "König-Wen-Hexagramm #{n}", "modal_desc_title": "📜 Wesentliche Beschreibung (kanonischer Kern):", "modal_nuc_title": "🧬 Kernhexagramm (innerer Same)", "modal_nuc_text": "Es steht für die zugrunde liegenden Kräfte (Linien 2 bis 5), die den Ausgang der Lage vorbereiten.", "modal_fuxi_title": "🌌 Früherer Himmel (Fu Xi / Xian Tian)", "modal_fuxi_text": "Symmetrische, richtungsbezogene archetypische Entsprechung nach der ursprünglichen Anordnung Fu Xis.", "modal_read_full": "📖 Die vollständige Übersetzung Richard Wilhelms auf El I Chingón lesen ↗", "modal_consult": "🔮 Dieses Hexagramm im Orakel befragen", "hex_question": "Was ist die tiefe Lehre von Hexagramm #{n} für mein Leben heute?", "toss_label": "Synchroner Münzwurf (Hexagramm #{n})", "alert": "Bitte schreibe eine Frage, um das Orakel zu befragen.", "res_badge": "✨ Synchrone Antwort des Orakels", "res_hex": "Hexagramm", "res_query": "Frage:", "res_draw": "Ziehung des Orakels", "res_canon": "📖 Kanonischer Text auf El I Chingón ↗", "res_present": "🎯 Diagnose des gegenwärtigen Moments:", "res_nuc": "🧬 Verborgener Kernsame (innerer Vektor):", "res_fuxi": "🌌 Archetyp des Früheren Himmels (Fu Xi):", "res_comp": "☯️ Aufbau:", "res_upper": "Oben", "res_lower": "Unten", "res_synth_title": "🕉️ Synthese des Inneren Guru (Swami Sri Yukteswar, Paramahansa Yogananda & Christusbriefe):", "res_synth": "Die kosmische Wandelbarkeit der äußeren Kräfte ist nur der Tanz von Maya und den Yugas. Hexagramm #{h} ({name}) zeigt, dass dein jetziger Zustand verlangt, den inneren Samen von #{nn} ({nuc}) zu pflegen. Reagiere nicht impulsiv auf vergängliche Erscheinungen; richte deinen Geist auf das gegenwärtige Christusbewusstsein und auf das ungehinderte Fließen des Tao aus. Wo innere Ausrichtung ist, zeigt sich der Weg ohne Mühe.", "res_full": "📖 Die vollständige Antwort mit den Lehren des Guru ansehen ↗", "res_source": "📌 Quelle und kanonische Zuordnung:", "res_wilhelm": "Beruht auf der kanonischen Übersetzung von <strong>Richard Wilhelm</strong> (abgeglichen mit dem de riferimenti comparativi al testo originale tedesco."}};
    const LANG_FULL = {"pt": "pt-BR", "en": "en-US", "es": "es-ES", "fr": "fr-FR", "de": "de-DE", "it": "it-IT"};
    const ORDEM_TRIG = ["Qián", "Kūn", "Zhèn", "Kǎn", "Gèn", "Xùn", "Lí", "Duì"];

    function idiomaInicial() {
      let l = "";
      try { l = new URLSearchParams(location.search).get("lang") || ""; } catch (e) {}
      if (!l) { try { l = localStorage.getItem("guru_iching_lang") || ""; } catch (e) {} }
      if (!l) l = (navigator.language || "pt");
      l = l.substring(0, 2).toLowerCase();
      return I18N[l] ? l : "pt";
    }
    let idiomaActual = idiomaInicial();

    function ui() { return I18N[idiomaActual] || I18N.pt; }
    function fmt(tpl, vars) { return String(tpl).replace(/\{(\w+)\}/g, (m, k) => (k in vars ? vars[k] : m)); }
    function escHtml(s) { return String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
    function obterNomeHex(h) { return h["nombre_" + idiomaActual] || h.nombre_es; }
    function obterDescHex(h) { return h["desc_" + idiomaActual] || h.desc_es; }
    function hexPorNum(n) { return HEXAGRAMAS.find(x => x.num === n); }
    function nomeTrig(t) { return t[idiomaActual] || t.es; }
    function urlApp() { return "index.html?lang=" + LANG_FULL[idiomaActual] + "#perguntar"; }

    function renderizarTabela(itens) {
      const tbody = document.getElementById('tbodyIChing');
      tbody.innerHTML = '';
      const u = ui();

      itens.forEach(h => {
        const tr = document.createElement('tr');
        const hNuc = hexPorNum(h.h_nuclear) || h;
        const hFuxi = hexPorNum(h.cielo_anterior) || h;
        tr.innerHTML = `
          <td><span class="hex-num-badge">#${h.num}</span></td>
          <td style="text-align:center;"><span class="hex-unicode" title="#${h.num}">${h.unicode_symbol}</span></td>
          <td>
            <strong>${obterNomeHex(h)}</strong><br>
            <span style="color:var(--text-muted); font-size:0.84rem;">${h.pinyin}</span>
            <span class="chinese-char">${h.chinese}</span>
          </td>
          <td>
            <div style="font-size:0.8rem; line-height:1.3;">
              <div><small style="color:var(--text-muted);">${u.sup}:</small> ${h.trigram_superior.sym} ${nomeTrig(h.trigram_superior)}</div>
              <div><small style="color:var(--text-muted);">${u.inf}:</small> ${h.trigram_inferior.sym} ${nomeTrig(h.trigram_inferior)}</div>
            </div>
          </td>
          <td><div style="color:#1E293B; font-weight:500;">${obterDescHex(h)}</div></td>
          <td><span class="pill-link" onclick="abrirHexagrama(${h.h_nuclear})">#${h.h_nuclear} ${obterNomeHex(hNuc)}</span></td>
          <td><span class="pill-link" onclick="abrirHexagrama(${h.cielo_anterior})">#${h.cielo_anterior} ${obterNomeHex(hFuxi)}</span></td>
          <td><a href="${h.link_elichingon}" target="_blank" class="btn-link-wilhelm">${u.read_wilhelm}</a></td>
        `;
        tbody.appendChild(tr);
      });

      document.getElementById('counterResultados').innerText = fmt(u.counter, { n: itens.length });
    }

    function filtrarTabla() {
      const q = document.getElementById('inpBusqueda').value.toLowerCase().trim();
      const trig = document.getElementById('selTrigrama').value;

      const filtrados = HEXAGRAMAS.filter(h => {
        const campos = [h.nombre_es, h.nombre_pt, h.nombre_en, obterNomeHex(h), obterDescHex(h), h.desc_es, h.pinyin];
        const matchNum = String(h.num) === q;
        const matchName = campos.some(c => c && c.toLowerCase().includes(q)) || h.chinese.includes(q);
        const matchTrig = !trig || h.trigram_superior.pinyin === trig;
        return (matchNum || matchName || q === '') && matchTrig;
      });

      renderizarTabela(filtrados);
    }

    function abrirHexagrama(num) {
      const h = hexPorNum(num);
      if (!h) return;
      const u = ui();
      const hNuc = hexPorNum(h.h_nuclear) || h;
      const hFuxi = hexPorNum(h.cielo_anterior) || h;
      document.getElementById('modalBody').innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px; margin-bottom:16px;">
          <div>
            <span class="header-badge">${fmt(u.modal_badge, { n: h.num })}</span>
            <h2 style="font-size:1.6rem; color:var(--navy-accent); font-family:'Cinzel', serif; margin-top:4px;">
              ${h.unicode_symbol} ${obterNomeHex(h)} <span class="chinese-char">${h.chinese}</span>
            </h2>
            <div style="font-size:0.95rem; color:var(--gold-accent); font-weight:700;">${h.pinyin}</div>
          </div>
          <div style="font-size:2.8rem; line-height:1; color:var(--navy-accent);">${h.unicode_symbol}</div>
        </div>

        <div style="background:var(--bg-soft); border:1px solid var(--border-color); border-radius:10px; padding:14px 18px; margin-bottom:12px;">
          <strong style="color:var(--text-main); display:block; margin-bottom:4px;">${u.modal_desc_title}</strong>
          <div style="font-size:1.05rem; color:#1E293B;">"${obterDescHex(h)}"</div>
        </div>

        <div style="font-size:0.9rem; line-height:1.55; margin-bottom:18px;">
          <strong>${u.res_comp}</strong><br>
          ${h.trigram_superior.sym} <strong>${u.res_upper}: ${nomeTrig(h.trigram_superior)}</strong> — ${h.trigram_superior["attr_" + idiomaActual] || ""}<br>
          ${h.trigram_inferior.sym} <strong>${u.res_lower}: ${nomeTrig(h.trigram_inferior)}</strong> — ${h.trigram_inferior["attr_" + idiomaActual] || ""}
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:18px;">
          <div style="border:1px solid var(--border-color); border-radius:10px; padding:12px; background:white;">
            <div style="font-size:0.78rem; font-weight:800; color:var(--navy-accent); text-transform:uppercase;">${u.modal_nuc_title}</div>
            <div style="font-size:1.1rem; font-weight:700; margin-top:4px;">#${hNuc.num} — ${obterNomeHex(hNuc)}</div>
            <p style="font-size:0.84rem; color:var(--text-muted); margin-top:4px;">${u.modal_nuc_text}</p>
          </div>
          <div style="border:1px solid var(--border-color); border-radius:10px; padding:12px; background:white;">
            <div style="font-size:0.78rem; font-weight:800; color:var(--gold-accent); text-transform:uppercase;">${u.modal_fuxi_title}</div>
            <div style="font-size:1.1rem; font-weight:700; margin-top:4px;">#${hFuxi.num} — ${obterNomeHex(hFuxi)}</div>
            <p style="font-size:0.84rem; color:var(--text-muted); margin-top:4px;">${u.modal_fuxi_text}</p>
          </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-top:1px solid var(--border-color); padding-top:16px;">
          <a href="${h.link_elichingon}" target="_blank" class="btn btn-gold">${u.modal_read_full}</a>
          <button class="btn" onclick="definirPreguntaParaHex(${h.num})">${u.modal_consult}</button>
        </div>
      `;
      document.getElementById('modalHex').style.display = 'flex';
    }

    function cerrarModal() { document.getElementById('modalHex').style.display = 'none'; }

    function definirPregunta(i) {
      document.getElementById('inpPregunta').value = ui().quick[i][1];
      consultarOraculo();
    }

    function definirPreguntaParaHex(num) {
      cerrarModal();
      document.getElementById('inpPregunta').value = fmt(ui().hex_question, { n: num });
      consultarOraculo(num);
    }

    function tiradaMonedasAleatoria() {
      const n = Math.floor(Math.random() * 64) + 1;
      document.getElementById('inpPregunta').value = fmt(ui().toss_label, { n });
      consultarOraculo(n);
    }

    let ultimoHex = null;
    function consultarOraculo(forcarNum = null, semRolar = false) {
      const u = ui();
      const q = document.getElementById('inpPregunta').value.trim();
      if (!q && !forcarNum) { alert(u.alert); return; }

      let hNum = forcarNum;
      if (!hNum) {
        let hash = 0;
        for (let i = 0; i < q.length; i++) hash = ((hash << 5) - hash) + q.charCodeAt(i);
        hNum = (Math.abs(hash ^ Date.now()) % 64) + 1;
      }
      ultimoHex = hNum;

      const h = hexPorNum(hNum) || HEXAGRAMAS[0];
      const hNuc = hexPorNum(h.h_nuclear) || h;
      const hFuxi = hexPorNum(h.cielo_anterior) || h;
      const nomeLocal = obterNomeHex(h), nucLocal = obterNomeHex(hNuc), fuxiLocal = obterNomeHex(hFuxi);
      const box = document.getElementById('boxResultadoOraculo');
      box.style.display = 'block';

      box.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:flex-start; flex-wrap:wrap; gap:12px; margin-bottom:14px; border-bottom:1px solid #CBD5E1; padding-bottom:12px;">
          <div>
            <span style="font-size:0.78rem; font-weight:800; color:var(--gold-accent); text-transform:uppercase; letter-spacing:1px;">${u.res_badge}</span>
            <h3 style="font-size:1.35rem; color:var(--navy-accent); margin-top:2px;">
              ${h.unicode_symbol} ${u.res_hex} #${h.num}: ${nomeLocal} (${h.pinyin} · ${h.chinese})
            </h3>
            <div style="font-size:0.92rem; color:var(--text-muted); margin-top:2px;"><strong>${u.res_query}</strong> "${escHtml(q || u.res_draw)}"</div>
          </div>
          <div style="text-align:right;">
            <a href="${h.link_elichingon}" target="_blank" class="btn btn-gold" style="font-size:0.8rem;">${u.res_canon}</a>
          </div>
        </div>

        <div style="font-size:1.02rem; color:#1E293B; line-height:1.6; margin-bottom:14px;">
          <strong>${u.res_present}</strong> "${obterDescHex(h)}"
        </div>

        <div style="background:white; border:1px solid #E2E8F0; border-radius:10px; padding:10px 12px; margin-bottom:14px; font-size:0.9rem; line-height:1.55;">
          <strong style="color:var(--navy-accent); font-size:0.85rem; display:block;">${u.res_comp}</strong>
          ${h.trigram_superior.sym} <strong>${u.res_upper}: ${nomeTrig(h.trigram_superior)}</strong> — ${h.trigram_superior["attr_" + idiomaActual] || ""}<br>
          ${h.trigram_inferior.sym} <strong>${u.res_lower}: ${nomeTrig(h.trigram_inferior)}</strong> — ${h.trigram_inferior["attr_" + idiomaActual] || ""}
        </div>

        <div style="display:grid; grid-template-columns:repeat(auto-fit, minmax(220px, 1fr)); gap:12px; margin-bottom:16px;">
          <div style="background:white; border:1px solid #E2E8F0; border-radius:10px; padding:12px;">
            <strong style="color:var(--navy-accent); font-size:0.85rem; display:block; margin-bottom:2px;">${u.res_nuc}</strong>
            <div style="font-size:0.95rem; font-weight:700;">${hNuc.unicode_symbol} #${hNuc.num} ${nucLocal}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">"${obterDescHex(hNuc)}"</div>
          </div>
          <div style="background:white; border:1px solid #E2E8F0; border-radius:10px; padding:12px;">
            <strong style="color:var(--gold-accent); font-size:0.85rem; display:block; margin-bottom:2px;">${u.res_fuxi}</strong>
            <div style="font-size:0.95rem; font-weight:700;">${hFuxi.unicode_symbol} #${hFuxi.num} ${fuxiLocal}</div>
            <div style="font-size:0.85rem; color:var(--text-muted); margin-top:2px;">"${obterDescHex(hFuxi)}"</div>
          </div>
        </div>

        <div style="background:#FFFBEB; border:1px solid #FDE68A; border-radius:10px; padding:14px 18px; margin-bottom:14px;">
          <strong style="color:#92400E; font-size:0.92rem; display:block; margin-bottom:4px;">${u.res_synth_title}</strong>
          <p style="font-size:0.92rem; color:#78350F; line-height:1.55;">"${fmt(u.res_synth, { h: h.num, name: nomeLocal, nn: hNuc.num, nuc: nucLocal })}"</p>
        </div>

        <div style="margin-bottom:14px;">
          <a href="${urlApp()}" class="btn btn-navy" style="font-size:0.85rem;">${u.res_full}</a>
        </div>

        <div style="font-size:0.82rem; color:#64748B; border-top:1px solid #CBD5E1; padding-top:10px; display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:6px;">
          <span>
            📌 <strong>${u.res_source.replace('📌 ', '')}</strong>
            <a href="https://elichingon.com/hexagramas/tabla-avanzada-correspondencias-i-ching/" target="_blank" style="color:var(--navy-accent); font-weight:700;">Tabla Avanzada de Correspondencias del I Ching · El I Chingón (elichingon.com)</a>
            &bull; ${u.res_wilhelm}
          </span>
          <span style="font-size:0.75rem; background:#E2E8F0; padding:2px 8px; border-radius:4px; font-weight:700;">KEC / CSHC Protocol</span>
        </div>
      `;

      if (!semRolar) box.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
    }

    function alterarIdioma(novoIdioma) {
      idiomaActual = I18N[novoIdioma] ? novoIdioma : "pt";
      try { localStorage.setItem("guru_iching_lang", idiomaActual); } catch (e) {}
      const u = ui();
      document.documentElement.lang = LANG_FULL[idiomaActual];
      document.title = u.page_title;
      document.getElementById('selLang').value = idiomaActual;
      const setT = (id, v) => { document.getElementById(id).innerText = v; };
      const setH = (id, v) => { document.getElementById(id).innerHTML = v; };
      setT('lblBrand', u.brand); setT('lblNavSub', u.nav_sub);
      setT('btnLibrary', u.btn_library); setT('btnOracleNav', u.btn_oracle_nav); setT('btnOfficial', u.btn_official);
      setT('lblHeaderBadge', u.badge); setH('lblHeaderTitle', u.title); setT('lblHeaderSubtitle', u.subtitle);
      setT('lblSrc', u.src_label); setH('lblSrcWilhelm', u.src_wilhelm);
      setT('lblTheoryTitle', u.theory_title); setH('lblTheoryP1', u.theory_p1);
      setT('lblTheoryNucTitle', u.theory_nuc_title); setT('lblTheoryNucDesc', u.theory_nuc_desc);
      setT('lblTheoryFuxiTitle', u.theory_fuxi_title); setT('lblTheoryFuxiDesc', u.theory_fuxi_desc);
      setT('lblOracleBadge', u.oracle_badge); setT('lblOracleTitle', u.oracle_title); setT('lblOracleDesc', u.oracle_desc);
      setT('btnConsultar', u.btn_consultar); setT('btnTirada', u.btn_tirar);
      setH('lblFooter1', u.footer1); setT('lblFooter2', u.footer2); setH('lblFooter3', u.footer3);
      document.getElementById('inpPregunta').placeholder = u.placeholder;
      document.getElementById('inpBusqueda').placeholder = u.search_placeholder;

      const quick = document.getElementById('boxQuick');
      quick.innerHTML = `<span style="font-size:0.8rem; font-weight:700; color:var(--text-muted); align-self:center;">${u.quick_label}</span>` +
        u.quick.map((par, i) => `<button type="button" class="quick-pill" onclick="definirPregunta(${i})">${par[0]}</button>`).join("");

      const sel = document.getElementById('selTrigrama');
      const atual = sel.value;
      const exemplo = {};
      HEXAGRAMAS.forEach(h => { exemplo[h.trigram_superior.pinyin] = h.trigram_superior; });
      sel.innerHTML = `<option value="">${u.trig_all}</option>` +
        ORDEM_TRIG.filter(p => exemplo[p]).map(p => `<option value="${p}">${nomeTrig(exemplo[p])} / ${p} (${exemplo[p].sym})</option>`).join("");
      sel.value = atual;

      document.querySelectorAll('#tablaIChing th').forEach((th, i) => { th.innerText = u.th[i] || ""; });
      filtrarTabla();
      if (document.getElementById('boxResultadoOraculo').style.display === 'block' && ultimoHex) consultarOraculo(ultimoHex, true);
    }

    window.addEventListener('DOMContentLoaded', () => alterarIdioma(idiomaActual));
  </script>
</body>
